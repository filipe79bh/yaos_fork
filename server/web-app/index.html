<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YAOS Web Vault</title>
<link rel="stylesheet" href="./vditor/index.css">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, sans-serif;
    background: #0b0f17;
    color: #e6e9ef;
    height: 100vh;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    background: #101623;
    border-bottom: 1px solid #1c2436;
    height: 48px;
  }
  header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
  header input {
    flex: 1;
    max-width: 520px;
    background: #0b0f17;
    border: 1px solid #232c42;
    color: inherit;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
  }
  header button {
    background: #1e2a45;
    color: inherit;
    border: 1px solid #2c3a5e;
    border-radius: 6px;
    padding: 6px 14px;
    cursor: pointer;
    font-size: 12px;
  }
  header button:hover { background: #26345a; }
  .status { font-size: 12px; color: #8b94a8; white-space: nowrap; }
  .status.ok { color: #4ade80; }
  .status.error { color: #f87171; }
  #layout { display: flex; height: calc(100vh - 48px); }
  #files-pane {
    width: 280px;
    min-width: 200px;
    overflow-y: auto;
    border-right: 1px solid #1c2436;
    background: #0e1420;
    padding: 6px;
  }
  #files-pane.hidden { display: none; }
  .file {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    color: #c8d0e0;
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .file:hover { background: #182238; }
  .file.active { background: #1e2a45; color: #fff; }
  .file.empty { color: #5b6478; cursor: default; }
  #editor { flex: 1; overflow: hidden; background: #0b0f17; }
</style>
</head>
<body>
<header>
  <h1>Web Vault</h1>
  <input id="setup-url" type="text" spellcheck="false"
         placeholder="Paste your mobile setup URL (https://your-server/mobile-setup#host=...&amp;token=...&amp;vaultId=...)">
  <button id="connect-btn">Connect</button>
  <button id="files-btn">Files</button>
  <span id="status" class="status">Not connected</span>
</header>
<div id="layout">
  <div id="files-pane"></div>
  <div id="editor"></div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
